  <body>
    <!-- ===== SHARED IMPORTS: resource and configurator ===== -->
    <script type="application/json" id="shared-assets" data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
      [
        { "path": "/css/animate.min.css", "optional": true },
        { "path": "/css/fontawesome.min.css", "optional": true },
        { "path": "/_fonts.min.js", "optional": false },
        { "path": "/_functions.min.js", "optional": false }
      ]
    </script>

    <!-- ===== RESOURCE ===== -->
    <script type="application/json" id="resource-assets" data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
      [
        { "path": "/js/gsap.min.js", "optional": false },
        { "path": "/js/morphSVGplugin.min.js", "optional": false }
      ]
    </script>
    <link rel="stylesheet" href="../resources.css" data-renderer-style />
    <link rel="stylesheet" href="./popup.css" data-renderer-style />
    <script src="../resource.js" defer></script>
    <script src="./popup.js" defer></script>
    <!-- Overlay: contains no configurator controls. -->
    <template id="overlay-markup">
      <div id="socialHolder">
        <div id="holder">
          <div id="iconBox">
            <!-- The hidden paths are targets for the visible square to morph into. -->
            <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" preserveAspectRatio="none" aria-hidden="true">
              <path id="square" d="M120,120H70H20V70V20h50h50v50V120z" />
              <path id="littleLeft" d="M120,20V70V120H70H20c0,0-5.8-19-5.8-50S20,20,20,20h50H120z" />
              <path id="littleRight" d="M20,120V70V20h50h50c0,0,5.8,19,5.8,50s-5.8,50-5.8,50H70H20z" />
              <path id="bigRight" d="M20,120V70V20h50h50c0,0,17.9,12.7,17.9,49.8S120,120,120,120H70H20z" />
              <path id="bigLeft" d="M120,20V70V120H70H20c0,0-17.9-12.7-17.9-49.8S20,20,20,20h50H120z" />
              <path id="bigDown" d="M20,20c0,0,12.8,6.6,50,6.6s50-6.6,50-6.6v50v50c0,0-12.8,10.5-50,10.5S20,120,20,120V70V20z" />
              <path id="bigUp" d="M120,120c0,0-12.8-6.6-50-6.6S20,120,20,120V70V20c0,0,12.8-10.5,50-10.5S120,20,120,20v50V120z" />
            </svg>
            <div id="iconHolder" aria-hidden="true">
              <div id="icons"></div>
            </div>
          </div>
          <div id="textBox">
            <div id="nameHolder"></div>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== CONFIGURATOR ===== -->
    <template id="configurator-assets">
      <script type="application/json" data-load data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
        [
          { "path": "/css/bootstrap.min.css", "optional": false },
          { "path": "/css/pickr.min.css", "optional": false },
          { "path": "/_common.min.css", "optional": false },
          { "path": "/css/select2.min.css", "optional": false },
          { "path": "/js/jquery.min.js", "optional": false },
          { "path": "/js/select2.full.min.js", "optional": false },
          { "path": "/js/popper.min.js", "optional": false },
          { "path": "/js/bootstrap.min.js", "optional": false },
          { "path": "/js/pickr.min.js", "optional": false },
          { "path": "/_common.min.js", "optional": false },
          { "path": "/_transitions.min.js", "optional": true }
        ]
      </script>
      <link rel="stylesheet" href="../configurator.css" data-editor-style media="not all" />
      <script src="../configurator.js" defer></script>
    </template>
    <div id="configurator"></div>
  </body>
</html>
