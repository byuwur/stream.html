    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Now Playing for OBS | stream.HTML" />
    <meta property="og:description" content="Display cover art, track details, and progress from an editable demo. Windows media integration is TBD." />
    <!-- <meta property="og:url" content="https://byuwur.github.io/stream.html/now-playing/" /> -->
    <meta property="og:url" content="https://stream.byuwur.co/now-playing/" />
    <!-- <meta property="og:image" content="https://byuwur.github.io/stream.html/now-playing/prev.jpg" /> -->
    <meta property="og:image" content="https://stream.byuwur.co/now-playing/prev.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@byUwUr" />
    <meta name="twitter:title" content="Now Playing for OBS | stream.HTML" />
    <meta name="twitter:description" content="Display cover art, track details, and progress from an editable demo. Windows media integration is TBD." />
    <!-- <meta name="twitter:image" content="https://byuwur.github.io/stream.html/now-playing/prev.jpg" /> -->
    <meta name="twitter:image" content="https://stream.byuwur.co/now-playing/prev.jpg" />
    <meta name="twitter:image:alt" content="Now Playing by BONYUR: OBS overlay configurator and live preview." />
  </head>

  <body>
    <!-- ===== SHARED IMPORTS: resource and configurator ===== -->
    <script type="application/json" id="shared-assets" data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.17">
      [
        { "path": "/css/animate.min.css", "optional": true },
        { "path": "/_fonts.min.js", "optional": false },
        { "path": "/_functions.min.js", "optional": false }
      ]
    </script>

    <!-- ===== RESOURCE ===== -->
    <link rel="stylesheet" href="../resources.css" data-renderer-style />
    <link rel="stylesheet" href="./now-playing.css" data-renderer-style />
    <script src="../resource.js" defer></script>
    <script src="./now-playing.js" defer></script>
    <template id="overlay-markup">
      <main id="overlay">
        <section class="panel" hidden>
          <div class="sleeve">
            <div class="disc"><img class="cover" alt="" /></div>
          </div>
          <div class="details">
            <strong class="track" hidden></strong>
            <span class="artist"></span>
            <span class="album"></span>
            <div class="timeline"><i></i></div>
            <div class="times"><span class="elapsed"></span><span class="total"></span></div>
          </div>
        </section>
        <span class="waiting" hidden>Waiting for media</span>
        <div class="demo-controls" role="group" aria-label="Demo tracks" hidden>
          <button type="button" data-step="-1" aria-label="Previous track">Previous</button>
          <button type="button" data-step="1" aria-label="Next track">Next</button>
        </div>
      </main>
    </template>
    <!-- ===== CONFIGURATOR ===== -->
    <template id="configurator-assets">
      <script type="application/json" data-load data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.17">
        [
          { "path": "/css/fontawesome.min.css", "optional": true },
          { "path": "/css/bootstrap.min.css", "optional": false },
          { "path": "/css/pickr.min.css", "optional": false },
          { "path": "/_common.min.css", "optional": false },
          { "path": "/css/select2.min.css", "optional": false },
          { "path": "/js/jquery.min.js", "optional": false },
          { "path": "/js/select2.full.min.js", "optional": false },
          { "path": "/js/popper.min.js", "optional": false },
          { "path": "/js/bootstrap.min.js", "optional": false },
          { "path": "/js/pickr.min.js", "optional": false },
          { "path": "/_common.min.js", "optional": false },
          { "path": "/_transitions.min.js", "optional": true }
        ]
      </script>
      <link rel="stylesheet" href="../configurator.css" data-editor-style media="not all" />
      <script src="../configurator.js" defer></script>
      <script src="../image-export.js" data-load-optional defer></script>
    </template>
    <div id="configurator"></div>
  </body>
</html>
