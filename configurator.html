<!doctype html>
<!-- A working base for your next overlay, with example fields and a live preview.
     Copy this HTML into your resource folder.
     Replace the demo CSS and JS with your resource's own files.
     Set shared imports to ../; keep custom editor behavior in a separate editor-only script. -->
<html lang="en" data-tool="template">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OBS Overlay Configurator Demo | stream.HTML</title>
    <meta name="description" content="Build your own OBS browser overlay with the stream.HTML configurator demo. Try URL-driven settings, form controls, and a live preview." />
    <meta name="author" content="Andrés Trujillo [Mateus] byUwUr" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#660000" />
    <link rel="canonical" href="https://byuwur.github.io/stream.html/configurator.html" />
    <link rel="icon" href="https://byuwur.github.io/stream.html/stream.html.png" />
    <!-- SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="stream.HTML" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="OBS Overlay Configurator Demo | stream.HTML" />
    <meta property="og:description" content="Build your own OBS browser overlay with the stream.HTML configurator demo. Try URL-driven settings, form controls, and a live preview." />
    <meta property="og:url" content="https://byuwur.github.io/stream.html/configurator.html" />
    <meta property="og:image" content="https://byuwur.github.io/stream.html/prev.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1076" />
    <meta property="og:image:alt" content="stream.HTML by BONYUR: free OBS overlay tools." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@byUwUr" />
    <meta name="twitter:title" content="OBS Overlay Configurator Demo | stream.HTML" />
    <meta name="twitter:description" content="Build your own OBS browser overlay with the stream.HTML configurator demo. Try URL-driven settings, form controls, and a live preview." />
    <meta name="twitter:image" content="https://byuwur.github.io/stream.html/prev.jpg" />
    <meta name="twitter:image:alt" content="stream.HTML by BONYUR: free OBS overlay tools." />
  </head>

  <body>
    <!-- ===== SHARED PAGE SETUP ===== -->

    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_fonts.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_functions.min.js" defer></script>
    <script src="./resource.js" defer></script>
    <!-- ===== RESOURCE DEMO ===== -->
    <template id="overlay-markup">
      <main id="demo-preview">
        <div class="demo-card">
          <p class="demo-label">This is the demo preview.</p>
          <p id="demo-message"></p>
          <p class="demo-note">Your resource goes here. The form controls this example.</p>
        </div>
      </main>
    </template>
    <!-- ./example.css -->
    <style data-renderer-style>
      /* Demo-only CSS; keep each real resource's styles in its own file. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        font-size: 16px;
      }
      #demo-preview {
        --demo-size: 48px;
        --demo-color: #ffffff;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        min-height: 100%;
        padding: 32px;
        font-family: "Courier New", Courier, monospace;
        text-align: center;
        color: var(--demo-color);
      }
      .demo-label,
      .demo-note {
        margin: 16px 0;
        font-size: 16px;
        line-height: 1.5;
        opacity: 0.65;
      }
      #demo-message {
        margin: 0;
        font-size: var(--demo-size);
        font-weight: 700;
        line-height: 1.2;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
    <!-- ./example.js -->
    <script>
      // Demo-only JavaScript; keep each real resource's renderer in its own file.
      document.addEventListener("DOMContentLoaded", async () => {
        // ==========
        // ==== RESOURCE DEFINITION ====
        // ==========

        // Defaults, URL constraints, and the field metadata consumed by the optional editor.
        const resource = {
          version: "1.0",
          title: "This is the form.",
          description: "Your next overlay starts here. Edit a field and watch the demo preview change.",
          preview: [1280, 720],
          urlRequired: ["message"],
          fields: {
            message: {
              type: "textarea",
              default: "Something awesome starts here.",
              label: "This is a text field.",
              section: "This is a section.",
              description: "Example plain text displayed in the demo preview.",
              maxlength: 160,
              icon: "fa-pen",
              rows: 2
            },
            fontSize: {
              type: "number",
              default: 48,
              label: "This is a number field (px).",
              section: "This is a section.",
              description: "Example text size in pixels.",
              min: 8,
              max: 96,
              step: "any",
              icon: "fa-font"
            },
            textColor: {
              type: "color",
              default: "#FFFFFF",
              label: "This is a color field (HEX).",
              section: "This is a section.",
              description: "Example text color. Pickr uses HEX, including alpha.",
              maxlength: 160,
              icon: "fa-palette"
            },
            ...byStream.textFields({
              heading: ["Demo heading", ".demo-label"],
              note: ["Demo note", ".demo-note"]
            })
          }
        };

        const settings = await byStream.initResource(resource);
        if (!byStreamOverlay) return;
        const preview = document.getElementById("demo-preview");
        document.getElementById("demo-message").textContent = settings.message;
        preview.style.setProperty("--demo-size", `${settings.fontSize}px`);
        preview.style.setProperty("--demo-color", settings.textColor);
      });
    </script>

    <!-- ===== CONFIGURATOR ===== -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/fontawesome.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/pickr.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_common.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/animate.min.css" />
    <link rel="stylesheet" href="./configurator.css" />
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/select2.full.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/popper.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/bootstrap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/pickr.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_common.min.js" defer></script>
    <!-- Configurator: URL toolbar, settings, preview, and help. -->
    <div id="configurator"></div>
    <script src="./configurator.js" defer></script>
  </body>
</html>
