name: Stream checks

on:
  workflow_call:
  # The release workflow calls these checks on main, version tags and pull requests.
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for this run
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      extended:
        description: Include appearance and layout checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: ${{ inputs.browser || 'chromium' }}
      extended: ${{ inputs.extended || false }}

  uploads:
    name: PHP uploads
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, fileinfo, gd
          coverage: none
      - run: php -l upload_image.php
      - run: node --test __tests__/upload-php.cjs
