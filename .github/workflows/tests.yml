name: Stream checks

on:
  workflow_call:
  # The release workflow calls these checks on main, version tags and pull requests.
  workflow_dispatch:
    inputs:
      browser:
        description: Browsers to test
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all
      extended:
        description: Include appearance and layout checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: >-
          ${{ fromJSON(
            (inputs.browser || 'all') == 'all' && '["chromium","firefox","webkit"]'
            || format('["{0}"]', inputs.browser)
          ) }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: ${{ matrix.browser }}
      extended: ${{ inputs.extended || false }}

  uploads:
    name: PHP uploads
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, fileinfo, gd
          coverage: none
      - run: php -l upload_image.php
      - run: node --test __tests__/upload-php.cjs
