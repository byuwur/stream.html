name: Stream checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resources_chromium:
    name: resources (chromium)
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: chromium
      suite: resources

  resources_firefox:
    name: resources (firefox)
    needs: resources_chromium
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: firefox
      suite: resources

  resources_webkit:
    name: resources (webkit)
    needs: resources_firefox
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: webkit
      suite: resources

  configurators_chromium:
    name: configurators (chromium)
    needs: resources_webkit
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: chromium
      suite: configurators

  configurators_firefox:
    name: configurators (firefox)
    needs: configurators_chromium
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: firefox
      suite: configurators

  configurators_webkit:
    name: configurators (webkit)
    needs: configurators_firefox
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/browser-check.yml
    with:
      browser: webkit
      suite: configurators

  uploads:
    name: PHP uploads
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, fileinfo, gd
          coverage: none
      - run: php -l upload_image.php
      - run: node --test __tests__/upload-php.cjs
