name: Browser check

on:
  workflow_call:
    inputs:
      browser:
        type: string
        required: true
      extended:
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    container:
      # Browser binaries are preinstalled and match the npm package.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      HOME: /root
      BROWSER_ENGINE: ${{ inputs.browser }}
      STREAM_CORE_ONLY: ${{ inputs.extended && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: stream.html
      - uses: actions/checkout@v4
        with:
          repository: byuwur/spa.js
          ref: v20.13
          path: spa.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked test tools
        working-directory: stream.html
        run: npm --prefix .github ci --ignore-scripts --no-audit --no-fund
      - name: Run core browser checks
        working-directory: stream.html
        env:
          NODE_PATH: ${{ github.workspace }}/stream.html/.github/node_modules
        run: node --test --test-concurrency=1 __tests__/resources.cjs __tests__/inputs.cjs __tests__/configurators.cjs
