name: Browser check

on:
  workflow_call:
    inputs:
      browser:
        type: string
        required: true
      suite:
        type: string
        required: true
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    container:
      # Browser binaries are preinstalled and match the npm package.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 3
    env:
      HOME: /root
      BROWSER_ENGINE: ${{ inputs.browser }}
      TEST_SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: stream.html
      - uses: actions/checkout@v4
        with:
          repository: byuwur/spa.js
          ref: v20.13
          path: spa.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        timeout-minutes: 1
        run: npm install --prefix "$RUNNER_TEMP/browser-tests" --no-package-lock --no-audit --no-fund playwright@1.63.0
      - name: Run focused checks
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tests/node_modules
        working-directory: stream.html
        timeout-minutes: 2
        run: |
          node --check resource.js
          node --check configurator.js
          node --test "__tests__/$TEST_SUITE.cjs"
          if [ "$TEST_SUITE" = "resources" ]; then node --test __tests__/inputs.cjs; fi
