  <body>
    <!-- ===== SHARED PAGE SETUP ===== -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/fontawesome.min.css" />
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_fonts.min.js" defer></script>

    <!-- ===== RESOURCE ===== -->
    <link rel="stylesheet" href="./main.css" data-renderer-style />
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/gsap.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_functions.min.js" defer></script>
    <script src="../resource.js" defer></script>
    <script src="./main.js" defer></script>
    <!-- Overlay: contains no configurator controls. -->
    <template id="overlay-markup">
      <div id="scene">
        <!-- Background media, tint, and frame. -->
        <div id="bg">
          <div id="image">
            <img alt="" onerror="this.hidden = true" />
          </div>
          <div id="video">
            <video autoplay loop muted></video>
          </div>
          <div id="overlay"></div>
          <div id="frame"></div>
        </div>
        <!-- Logo, title, and subtitle. -->
        <div id="branding">
          <div id="brandImg"></div>
          <span id="title"></span>
          <span id="subtitle"></span>
        </div>
        <!-- Rotating social accounts and schedule. -->
        <div id="updates">
          <div id="social"></div>
          <div id="schedule">
            <div id="week" class="item"></div>
          </div>
        </div>
        <div id="list">
          <div id="one" class="event">
            <div class="borderLeft"></div>
            <div id="followName" class="name">&nbsp;</div>
            <div id="followLine" class="type"></div>
          </div>
          <div id="two" class="event">
            <div class="borderLeft"></div>
            <div id="tipName" class="name">&nbsp;</div>
            <div id="tipLine" class="type"></div>
          </div>
          <div id="three" class="event">
            <div class="borderLeft"></div>
            <div id="bigTipName" class="name">&nbsp;</div>
            <div id="bigTipLine" class="type"></div>
          </div>
          <div id="four" class="event">
            <div class="borderLeft"></div>
            <div id="subName" class="name">&nbsp;</div>
            <div id="subLine" class="type"></div>
          </div>
        </div>
        <!-- Countdown and completion message. -->
        <div id="countdown">
          <div id="timer">
            <div id="time"></div>
            <div id="message"></div>
            <div id="endMessage" hidden></div>
          </div>
        </div>
      </div>
    </template>

    <!-- ===== CONFIGURATOR ===== -->
    <template id="configurator-assets">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/bootstrap.min.css" data-editor-style media="not all" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/pickr.min.css" data-editor-style media="not all" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_common.min.css" data-editor-style media="not all" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/select2.min.css" data-editor-style media="not all" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/css/animate.min.css" data-editor-style media="not all" />
      <link rel="stylesheet" href="../configurator.css" data-editor-style media="not all" />
      <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/jquery.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/select2.full.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/popper.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/bootstrap.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/js/pickr.min.js" defer></script>
      <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.7/_common.min.js" defer></script>

      <!-- Configurator: URL toolbar, settings, preview, and help. -->
      <script src="../configurator.js" defer></script>
    </template>
    <div id="configurator"></div>
  </body>
