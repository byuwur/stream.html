<!doctype html>
<html lang="es" class="bywr-configurator" data-tool="main">

<head>
  <!-- ===== PAGE METADATA ===== -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta property="og:title" content="Main Scene = [Mateus] byUwUr" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://byuwur.github.io/img/logo.png" />
  <meta property="og:url" content="https://mainscene.byuwur.co" />
  <meta property="og:site_name" content="Main Scene = [Mateus] byUwUr" />
  <meta property="og:description" content="Bring your brand to your steam." />
  <link rel="icon" href="https://byuwur.github.io/img/logo.png" />
  <title>Main Scene = [Mateus] byUwUr</title>
</head>

<body>
  <!-- ===== SHARED PAGE SETUP ===== -->
  <script src="../configurator.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/css/fontawesome.min.css" />

  <!-- ===== RESOURCE ===== -->
  <link rel="stylesheet" href="./main.css" data-renderer-style />
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/js/gsap.min.js" defer></script>
  <script src="./main.js" defer></script>
  <!-- Overlay: contains no configurator controls. -->
  <template id="overlay-markup">
    <div id="scene">
      <!-- Background media, tint, and frame. -->
      <div id="bg">
        <div id="image">
          <img alt="" onerror="this.hidden = true" />
        </div>
        <div id="video">
          <video autoplay loop muted></video>
        </div>
        <div id="overlay"></div>
        <div id="frame"></div>
      </div>
      <!-- Logo, title, and subtitle. -->
      <div id="branding">
        <div id="brandImg"></div>
        <span id="title"></span>
        <span id="subtitle"></span>
      </div>
      <!-- Rotating social accounts and schedule. -->
      <div id="updates">
        <div id="social"></div>
        <div id="schedule">
          <div id="week" class="item"></div>
        </div>
      </div>
      <div id="list">
        <div id="one" class="event">
          <div class="borderLeft"></div>
          <div id="followName" class="name">
            &nbsp;
          </div>
          <div id="followLine" class="type"></div>
        </div>
        <div id="two" class="event">
          <div class="borderLeft"></div>
          <div id="tipName" class="name">
            &nbsp;
          </div>
          <div id="tipLine" class="type"></div>
        </div>
        <div id="three" class="event">
          <div class="borderLeft"></div>
          <div id="bigTipName" class="name">
            &nbsp;
          </div>
          <div id="bigTipLine" class="type"></div>
        </div>
        <div id="four" class="event">
          <div class="borderLeft"></div>
          <div id="subName" class="name">
            &nbsp;
          </div>
          <div id="subLine" class="type"></div>
        </div>
      </div>
      <!-- Countdown and completion message. -->
      <div id="countdown">
        <div id="timer">
          <div id="time"></div>
          <div id="message"></div>
          <div id="endMessage" hidden></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ===== CONFIGURATOR ===== -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/css/bootstrap.min.css" data-editor-style />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/css/pickr.min.css" data-editor-style />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/_common.css" data-editor-style />
  <link rel="stylesheet" href="../configurator.css" data-editor-style />
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/js/jquery.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/js/bootstrap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/js/pickr.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.php@v19.4/_common.js" defer></script>
  <!-- Optional hook: runs after defaults populate the form, only in the configurator. -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (byStreamOverlay) return;
      window.byConfigureResource = function ({ settings }, { initEntryEditor, platforms }) {
        const weekdays = { monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday", thursday: "Thursday", friday: "Friday", saturday: "Saturday", sunday: "Sunday" };

        initEntryEditor("accounts", settings.accounts, {
          choices: platforms,
          choiceKey: "platform",
          textFields: [["handle", "Handle or display text"], ["heading", "Heading"]],
          newEntry: { platform: "twitch", handle: "", heading: "" }
        });
        initEntryEditor("scheduleEntries", settings.scheduleEntries, {
          choices: weekdays,
          choiceKey: "day",
          textFields: [["text", "Schedule text"]],
          newEntry: { day: "monday", text: "" },
          limit: 7
        });
      };
    });
  </script>
  <!-- Configurator: URL toolbar, settings, preview, and help. -->
  <template id="editor-markup">
    <main id="setup" class="d-flex flex-column vh-100 overflow-hidden">
      <!-- URL toolbar and tool navigation. -->
      <header class="url-toolbar has-overlay light-links d-flex flex-column gap-2 p-2 bg-primary border-bottom sticky-top flex-shrink-0">
        <div class="overlay-vertical-inverted pe-none" aria-hidden="true"></div>
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
          <div class="d-flex align-items-center gap-2">
            <img src="https://byuwur.github.io/img/logo.png" alt="" />
            <details class="tool-switcher position-relative flex-shrink-0 me-2" data-tool="main">
              <summary class="tool-brand list-unstyled d-flex align-items-center gap-2 fw-bold text-nowrap fs-5" aria-label="stream.html tools">
                <span class="tool-wordmark text-white">stream<span>.html</span></span>
                <span class="tool-caret text-white" aria-hidden="true">&#9662;</span>
              </summary>
              <nav class="dropdown-menu d-none rounded-0 shadow mt-0" aria-label="Tools">
                <a class="dropdown-item py-2" href="../controller/index.html"><i class="fa-solid fa-gamepad fa-fw me-2" aria-hidden="true"></i>Controller</a>
                <a class="dropdown-item py-2" href="../popup/index.html"><i class="fa-solid fa-comment fa-fw me-2" aria-hidden="true"></i>Popup</a>
                <a class="dropdown-item py-2" href="../main/index.html"><i class="fa-solid fa-clapperboard fa-fw me-2" aria-hidden="true"></i>Main scene</a>
              </nav>
            </details>
          </div>
          <p class="config-credit d-none d-md-block m-0 ms-auto text-end small text-white">
            &copy;
            2026, Made with
            <i class="fa-solid fa-heart text-danger align-middle" role="img" aria-label="love"></i>
            by
            <a href="https://byuwur.co" target="_blank" rel="noopener" class="text-white link-body-emphasis">
              BONYUR @byUwUr
            </a>
          </p>
          <nav class="config-menu d-flex align-items-center gap-2 flex-shrink-0" aria-label="Configurator menu">
            <button id="theme-toggle" class="theme-toggle rounded-0 border border-light text-white" type="button" disabled title="Loading theme controls" aria-label="Toggle theme" aria-pressed="true">
              <span aria-hidden="true">&#9790;&#65038; &#9728;&#65038;</span>
            </button>
            <a class="btn btn-sm btn-outline-light text-nowrap" href="https://github.com/byuwur/stream.html" target="_blank" rel="noopener" title="Source code">
              <i class="fa-brands fa-github me-1" aria-hidden="true"></i>
              GitHub
            </a>
          </nav>
        </div>
        <div class="d-flex align-items-center gap-2">
          <label class="url-field flex-grow-1 overflow-hidden text-body form-label d-flex flex-column gap-1 w-100 m-0" for="overlay-url">
            <span class="visually-hidden">Overlay URL</span>
            <input id="overlay-url" readonly spellcheck="false" class="form-control rounded-0 bg-body-secondary border-secondary-subtle font-monospace small" />
          </label>
          <button id="copy-url" class="btn btn-sm btn-light flex-shrink-0 text-nowrap" type="button">
            <i class="fa-solid fa-copy me-2" aria-hidden="true"></i>
            <span class="copy-label">Copy URL</span>
          </button>
          <button class="btn btn-sm btn-outline-light flex-shrink-0 text-nowrap" type="reset" form="overlay-form">
            <i class="fa-solid fa-arrow-rotate-left me-2" aria-hidden="true"></i>
            Reset
          </button>
        </div>
      </header>
      <div class="setup-layout row g-0 flex-grow-1 flex-column flex-md-row flex-nowrap overflow-auto">
        <!-- Editable settings. -->
        <aside class="settings-panel h-100 flex-shrink-0 col-12 col-md-4 bg-body-tertiary p-3 overflow-y-auto border-end" aria-label="Overlay parameters">
          <h1 class="h4 mb-1"><i class="fa-solid fa-clapperboard me-2" aria-hidden="true"></i>Main scene</h1>
          <p class="setup-intro text-body-secondary">
            Set up your starting, BRB, ending, or intermission scene.
          </p>
          <form id="overlay-form" data-configurator class="accordion">
            <fieldset class="accordion-item mb-3 border border-secondary-subtle bg-body p-2">
              <legend class="float-start w-100 fs-6 fw-semibold border-bottom pb-2 mb-2 text-primary">
                <button id="main-scene-toggle" class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#main-scene" aria-expanded="true" aria-controls="main-scene"><i class="fa-solid fa-clapperboard me-2"
                    aria-hidden="true"></i>Scene</button>
              </legend>
              <div id="main-scene" class="accordion-collapse collapse show" aria-labelledby="main-scene-toggle">
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-heading fa-fw text-primary" aria-hidden="true"></i>
                    <span>Title (line breaks supported)</span>
                  </span>
                  <textarea name="sceneTitle" data-description="Main heading displayed on the scene. Line breaks are supported." data-group="options" maxlength="300" rows="2"
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle"></textarea>
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-quote-left fa-fw text-primary" aria-hidden="true"></i>
                    <span>Subtitle</span>
                  </span>
                  <input name="tagline" data-description="Subtitle displayed beneath the main heading." data-group="options" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hashtag fa-fw text-primary" aria-hidden="true"></i>
                    <span>Countdown (minutes)</span>
                  </span>
                  <input name="countdownTime" data-description="Duration of the countdown in minutes." data-group="countdown" type="number" min="0" max="1440" step="any" required
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-list fa-fw text-primary" aria-hidden="true"></i>
                    <span>Countdown</span>
                  </span>
                  <select name="displayCountdown" data-description="Shows or hides the countdown area." data-group="countdown" class="form-select rounded-0 bg-body-secondary border-secondary-subtle">
                    <option value="yes">Show</option>
                    <option value="no">Hide</option>
                  </select>
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-pen fa-fw text-primary" aria-hidden="true"></i>
                    <span>Countdown message</span>
                  </span>
                  <input name="countdownMessage" data-description="Message displayed while the timer runs." data-group="countdown" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-pen fa-fw text-primary" aria-hidden="true"></i>
                    <span>Finished message</span>
                  </span>
                  <input name="countdownOverMessage" data-description="Message displayed when the timer finishes." data-group="countdown" type="text" maxlength="160"
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
              </div>
            </fieldset>
            <fieldset class="accordion-item mb-3 border border-secondary-subtle bg-body p-2">
              <legend class="float-start w-100 fs-6 fw-semibold border-bottom pb-2 mb-2 text-primary">
                <button id="main-appearance-toggle" class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#main-appearance" aria-expanded="true" aria-controls="main-appearance"><i class="fa-solid fa-palette me-2"
                    aria-hidden="true"></i>Appearance</button>
              </legend>
              <div id="main-appearance" class="accordion-collapse collapse show" aria-labelledby="main-appearance-toggle">
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-font fa-fw text-primary" aria-hidden="true"></i>
                    <span>Font family</span>
                  </span>
                  <input name="primaryFont" data-description="Font family to use. It must be available on the viewing computer." data-group="fonts" type="text" maxlength="160"
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-font fa-fw text-primary" aria-hidden="true"></i>
                    <span>Title size (px)</span>
                  </span>
                  <input name="titleSize" data-description="Main heading size in pixels." data-group="fonts" type="number" min="8" max="200" step="any" required class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-font fa-fw text-primary" aria-hidden="true"></i>
                    <span>Subtitle size (px)</span>
                  </span>
                  <input name="subtitleSize" data-description="Subtitle size in pixels." data-group="fonts" type="number" min="8" max="200" step="any" required class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-palette fa-fw text-primary" aria-hidden="true"></i>
                    <span>Text color (CSS color)</span>
                  </span>
                  <input name="primaryTextColor" data-description="CSS color used for primary text." data-group="colors" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-palette fa-fw text-primary" aria-hidden="true"></i>
                    <span>Secondary text color</span>
                  </span>
                  <input name="subTextColor" data-description="CSS color used for secondary text." data-group="colors" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-palette fa-fw text-primary" aria-hidden="true"></i>
                    <span>Accent color</span>
                  </span>
                  <input name="accentColor" data-description="CSS color used for accents." data-group="colors" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-palette fa-fw text-primary" aria-hidden="true"></i>
                    <span>Frame color</span>
                  </span>
                  <input name="frameColor" data-description="CSS color of the scene border." data-group="colors" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hashtag fa-fw text-primary" aria-hidden="true"></i>
                    <span>Frame width (px)</span>
                  </span>
                  <input name="frameWidth" data-description="Scene border thickness in pixels." data-group="options" type="number" min="0" max="100" step="any" required
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-list fa-fw text-primary" aria-hidden="true"></i>
                    <span>Logo</span>
                  </span>
                  <select name="displayBranding" data-description="Shows or hides the logo independently of the title." data-group="options" class="form-select rounded-0 bg-body-secondary border-secondary-subtle">
                    <option value="yes">Show</option>
                    <option value="no">Hide</option>
                  </select>
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-pen fa-fw text-primary" aria-hidden="true"></i>
                    <span>Logo URL or relative image path</span>
                  </span>
                  <input name="logoUrl" data-description="Image URL or relative path. Empty keeps the bundled logo." data-group="options" type="text" maxlength="160"
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hashtag fa-fw text-primary" aria-hidden="true"></i>
                    <span>Logo opacity</span>
                  </span>
                  <input name="logoOpacity" data-description="Logo opacity, from transparent to fully opaque." data-group="options" type="number" min="0" max="1" step="any" required
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hashtag fa-fw text-primary" aria-hidden="true"></i>
                    <span>Logo scale</span>
                  </span>
                  <input name="logoScale" data-description="Multiplier applied to the logo size." data-group="options" type="number" min="0.1" max="5" step="any" required
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-palette fa-fw text-primary" aria-hidden="true"></i>
                    <span>Background color</span>
                  </span>
                  <input name="backgroundColor" data-description="CSS background color behind the scene and its media. Transparent by default." data-group="colors" type="text" maxlength="160"
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-list fa-fw text-primary" aria-hidden="true"></i>
                    <span>Background type</span>
                  </span>
                  <select name="backgroundType" data-description="Selects image or video background media." data-group="options" class="form-select rounded-0 bg-body-secondary border-secondary-subtle">
                    <option value="video">Video</option>
                    <option value="image">Image</option>
                  </select>
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-pen fa-fw text-primary" aria-hidden="true"></i>
                    <span>Background URL or relative path</span>
                  </span>
                  <input name="backgroundUrl" data-description="Public media URL or relative file path. Does not upload a file." data-group="options" type="text" maxlength="160"
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hashtag fa-fw text-primary" aria-hidden="true"></i>
                    <span>Background blur (px)</span>
                  </span>
                  <input name="backgroundBlur" data-description="Background blur radius in pixels." data-group="options" type="number" min="0" max="100" step="any" required
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-hashtag fa-fw text-primary" aria-hidden="true"></i>
                    <span>Background tint opacity</span>
                  </span>
                  <input name="backgroundOverlayOpacity" data-description="Opacity of the tint over the background." data-group="options" type="number" min="0" max="1" step="any" required
                    class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-palette fa-fw text-primary" aria-hidden="true"></i>
                    <span>Background tint color</span>
                  </span>
                  <input name="backgroundOverlay" data-description="CSS color of the background tint." data-group="colors" type="text" maxlength="160" class="form-control rounded-0 bg-body-secondary border-secondary-subtle" />
                </label>
              </div>
            </fieldset>
            <fieldset class="accordion-item mb-3 border border-secondary-subtle bg-body p-2">
              <legend class="float-start w-100 fs-6 fw-semibold border-bottom pb-2 mb-2 text-primary">
                <button id="main-accounts-toggle" class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#main-accounts" aria-expanded="true" aria-controls="main-accounts"><i class="fa-solid fa-users me-2"
                    aria-hidden="true"></i>Social accounts</button>
              </legend>
              <div id="main-accounts" class="accordion-collapse collapse show" aria-labelledby="main-accounts-toggle">
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-list fa-fw text-primary" aria-hidden="true"></i>
                    <span>Social accounts</span>
                  </span>
                  <select name="displaySocial" data-description="Shows or hides the social account area." data-group="social" class="form-select rounded-0 bg-body-secondary border-secondary-subtle">
                    <option value="yes">Show</option>
                    <option value="no">Hide</option>
                  </select>
                </label>
                <input name="accounts" data-title="Social accounts" data-description="Ordered account JSON: up to 100 entries with a supported platform, handle, and optional heading of up to 160 characters each." type="hidden" />
                <div id="account-list" class="entry-list"></div>
                <button id="add-account" class="add-entry btn btn-sm btn-primary w-100 mt-2" type="button">
                  <i class="fa-solid fa-plus me-2" aria-hidden="true"></i>
                  Add account
                </button>
              </div>
            </fieldset>
            <fieldset class="accordion-item mb-3 border border-secondary-subtle bg-body p-2">
              <legend class="float-start w-100 fs-6 fw-semibold border-bottom pb-2 mb-2 text-primary">
                <button id="main-schedule-toggle" class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#main-schedule" aria-expanded="true" aria-controls="main-schedule"><i class="fa-solid fa-calendar-days me-2"
                    aria-hidden="true"></i>Schedule</button>
              </legend>
              <div id="main-schedule" class="accordion-collapse collapse show" aria-labelledby="main-schedule-toggle">
                <label class="form-label d-flex flex-column gap-1 w-100 mb-3">
                  <span class="field-caption d-flex align-items-center gap-2">
                    <i class="fa-solid fa-list fa-fw text-primary" aria-hidden="true"></i>
                    <span>Schedule</span>
                  </span>
                  <select name="displaySchedule" data-description="Shows or hides the weekly schedule." data-group="schedule" class="form-select rounded-0 bg-body-secondary border-secondary-subtle">
                    <option value="yes">Show</option>
                    <option value="no">Hide</option>
                  </select>
                </label>
                <input name="scheduleEntries" data-title="Schedule" data-description="Ordered schedule JSON: up to 7 entries with a weekday and schedule text of up to 160 characters." type="hidden" />
                <div id="schedule-list" class="entry-list"></div>
                <button id="add-day" class="add-entry btn btn-sm btn-primary w-100 mt-2" type="button">
                  <i class="fa-solid fa-plus me-2" aria-hidden="true"></i>
                  Add day
                </button>
              </div>
            </fieldset>
          </form>
        </aside>
        <!-- Scaled view of the actual overlay. -->
        <section class="preview-panel h-100 order-first order-md-last flex-shrink-0 col-12 col-md-8 bg-body p-3 d-flex flex-column gap-2" aria-label="Overlay preview">
          <header class="preview-toolbar d-flex justify-content-between align-items-center small">
            <strong><i class="fa-solid fa-eye me-2" aria-hidden="true"></i>Live preview</strong>
            <a id="preview-url" target="_blank" rel="noopener" class="link-body-emphasis">
              <i class="fa-solid fa-arrow-up-right-from-square me-2" aria-hidden="true"></i>
              Open overlay
            </a>
          </header>
          <div id="preview-stage" class="ratio ratio-16x9 flex-grow-1 overflow-hidden border rounded-0 bg-body-secondary">
            <svg id="preview-viewport" viewBox="0 0 1920 1080" role="group" aria-label="Scaled overlay preview">
              <foreignObject width="100%" height="100%">
                <iframe id="overlay-preview" class="border-0" title="Main scene preview" allow="autoplay; gamepad *"></iframe>
              </foreignobject>
            </svg>
          </div>
          <!-- Preview update status and reset guidance. -->
          <footer class="preview-footer d-flex flex-wrap justify-content-between gap-2 small text-body-secondary">
            <span id="preview-status">Change a parameter to update the preview.</span>
            <span id="copy-status" role="status"></span>
            <p class="setup-help m-0 ms-auto text-end">
              Reset restores the settings loaded when you opened this page.
            </p>
          </footer>
        </section>
      </div>
      <div id="accessibility-preset"></div>
      <!-- Help navigation. -->
      <footer class="config-footer border-top p-2 text-body-secondary flex-shrink-0">
        <nav class="footer-links px-5 text-center" aria-label="Help"></nav>
      </footer>
    </main>
  </template>
</body>
