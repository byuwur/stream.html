<!doctype html>
<html lang="en" data-tool="keyboard">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyboard &amp; Mouse for OBS | stream.HTML</title>
    <meta name="description" content="Live keyboard, mouse, and ephemeral Input History overlays with Kenney SVG artwork. Browser-focused input for OBS by BONYUR." />
    <meta name="author" content="Andrés Trujillo [Mateus] byUwUr" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#600" />
    <!-- <link rel="canonical" href="https://byuwur.github.io/stream.html/keyboard/" /> -->
    <link rel="canonical" href="https://stream.byuwur.co/keyboard/" />
    <!-- <link rel="icon" href="https://byuwur.github.io/stream.html/stream.html.png" /> -->
    <link rel="icon" href="../stream.html.png" />
    <!-- SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="stream.HTML" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Keyboard &amp; Mouse for OBS | stream.HTML" />
    <meta property="og:description" content="Live keyboard, mouse, and ephemeral Input History overlays with Kenney SVG artwork. Browser-focused input for OBS by BONYUR." />
    <!-- <meta property="og:url" content="https://byuwur.github.io/stream.html/keyboard/" /> -->
    <meta property="og:url" content="https://stream.byuwur.co/keyboard/" />
    <!-- <meta property="og:image" content="https://byuwur.github.io/stream.html/keyboard/prev.jpg" /> -->
    <meta property="og:image" content="https://stream.byuwur.co/keyboard/prev.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="Keyboard &amp; Mouse by BONYUR: OBS overlay configurator and live preview." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@byUwUr" />
    <meta name="twitter:title" content="Keyboard &amp; Mouse for OBS | stream.HTML" />
    <meta name="twitter:description" content="Live keyboard, mouse, and ephemeral Input History overlays with Kenney SVG artwork. Browser-focused input for OBS by BONYUR." />
    <!-- <meta name="twitter:image" content="https://byuwur.github.io/stream.html/keyboard/prev.jpg" /> -->
    <meta name="twitter:image" content="https://stream.byuwur.co/keyboard/prev.jpg" />
    <meta name="twitter:image:alt" content="Keyboard &amp; Mouse by BONYUR: OBS overlay configurator and live preview." />
  </head>

  <body>
    <!-- ===== SHARED IMPORTS: resource and configurator ===== -->
    <script type="application/json" id="shared-assets" data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
      [
        { "path": "/css/animate.min.css", "optional": true },
        { "path": "/_functions.min.js", "optional": false }
      ]
    </script>

    <!-- ===== RESOURCE ===== -->
    <link rel="stylesheet" href="../resources.css" data-renderer-style />
    <link rel="stylesheet" href="./keyboard.css" data-renderer-style />
    <script src="../resource.js" defer></script>
    <script src="./keyboard.js" defer></script>
    <template id="overlay-markup">
      <main id="keyboard-overlay" aria-label="Keyboard and mouse input">
        <div id="input-scene" data-stream-viewport>
          <div id="keyboard"></div>
          <div id="mouse"></div>
        </div>
      </main>
    </template>
    <!-- ===== CONFIGURATOR ===== -->
    <template id="configurator-assets">
      <script type="application/json" data-load data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
        [
          { "path": "/css/fontawesome.min.css", "optional": true },
          { "path": "/css/bootstrap.min.css", "optional": false },
          { "path": "/css/pickr.min.css", "optional": false },
          { "path": "/_common.min.css", "optional": false },
          { "path": "/css/select2.min.css", "optional": false },
          { "path": "/js/jquery.min.js", "optional": false },
          { "path": "/js/select2.full.min.js", "optional": false },
          { "path": "/js/popper.min.js", "optional": false },
          { "path": "/js/bootstrap.min.js", "optional": false },
          { "path": "/js/pickr.min.js", "optional": false },
          { "path": "/_common.min.js", "optional": false },
          { "path": "/_transitions.min.js", "optional": true }
        ]
      </script>
      <link rel="stylesheet" href="../configurator.css" data-editor-style media="not all" />
      <script src="../configurator.js" defer></script>
      <script src="../image-export.js" data-load-optional defer></script>
      <script>
        byConfigurator.configureResource = () => ({
          initResourceHelp(help) {
            $(help).find('[data-panel="info"]').append(/* HTML */ `<p class="small mt-3">Keyboard and mouse artwork by <a href="https://kenney.nl/assets/input-prompts" target="_blank" rel="noopener">Kenney</a> (Input Prompts).</p>`);
          }
        });
      </script>
    </template>
    <div id="configurator"></div>
  </body>
</html>
