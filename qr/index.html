  <body>
    <!-- ===== SHARED IMPORTS: resource and configurator ===== -->
    <script type="application/json" id="shared-assets" data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
      [
        { "path": "/css/animate.min.css", "optional": true },
        { "path": "/_fonts.min.js", "optional": false },
        { "path": "/_functions.min.js", "optional": false }
      ]
    </script>

    <!-- ===== RESOURCE ===== -->
    <link rel="stylesheet" href="../resources.css" data-renderer-style />
    <link rel="stylesheet" href="./qr.css" data-renderer-style />
    <script src="../resource.js" defer></script>
    <script src="./qr.js" defer></script>
    <template id="overlay-markup">
      <main id="overlay">
        <div class="panel"></div>
      </main>
    </template>
    <!-- ===== CONFIGURATOR ===== -->
    <template id="configurator-assets">
      <script type="application/json" data-load data-source="https://cdn.jsdelivr.net/gh/byuwur/spa.js" data-spa-version="v20.18">
        [
          { "path": "/css/fontawesome.min.css", "optional": true },
          { "path": "/css/bootstrap.min.css", "optional": false },
          { "path": "/css/pickr.min.css", "optional": false },
          { "path": "/_common.min.css", "optional": false },
          { "path": "/css/select2.min.css", "optional": false },
          { "path": "/js/jquery.min.js", "optional": false },
          { "path": "/js/select2.full.min.js", "optional": false },
          { "path": "/js/popper.min.js", "optional": false },
          { "path": "/js/bootstrap.min.js", "optional": false },
          { "path": "/js/pickr.min.js", "optional": false },
          { "path": "/_common.min.js", "optional": false },
          { "path": "/_transitions.min.js", "optional": true }
        ]
      </script>
      <link rel="stylesheet" href="../configurator.css" data-editor-style media="not all" />
      <script src="../configurator.js" defer></script>
      <script src="../image-export.js" data-load-optional defer></script>
    </template>
    <div id="configurator"></div>
  </body>
</html>
