  <style>
    .custom-colors .shell-base { fill: var(--controller-color); }
    .custom-colors .shell-panel { fill: var(--controller-panel); }
    .hardware-marking { opacity: 0.65; } .custom-colors .hardware-marking { fill: var(--controller-ink); }
    .vector-outline { stroke-linecap: round; stroke-linejoin: round; }
    .shell-highlight { fill: #ffffff; opacity: var(--highlight-intensity, 0.12); }
    .shell-shadow { fill: #000000; opacity: var(--shadow-intensity, 0.16); }
    .screen-surface { fill: #111111; opacity: var(--screen-opacity, 0); }
    .word-label, .compact-geometry, .minimal-hardware { display: none; }
    [data-labels="letters"] .hardware-icon { display: none; }
    [data-labels="letters"] .word-label { display: inline; }
    [data-labels="none"] .marking { display: none; }
    [data-layout="minimal"] #shell, [data-layout="minimal"] .shell-decoration, [data-layout="minimal"] .full-only-decoration { display: none; }
    [data-layout="minimal"] .minimal-hardware { display: inline; }
    [data-layout="minimal"] .full-hardware { display: none; }
    [data-layout="minimal"][data-labels="letters"] .compact-geometry.word-label { display: inline; }
    [data-layout="minimal"] .minimal-omit, [data-layout="minimal"].minimal-omit { display: none; }
    .player-indicator { fill: #20252c; stroke: #111111; stroke-width: 0.6; }
    .player-indicator.lit { fill: var(--player-color, #65e374); }
    .marking { pointer-events: none; }
    [data-labels="letters"] .hardware-icon, [data-labels="none"] .marking { display: none; }

    .custom-colors .socket-base { fill: var(--controller-socket); }
    .guide-custom-housing { display: none; }
  </style>
