<body class="d-flex flex-column min-vh-100 bg-dark text-white light-links">
  <!-- ===== HOMEPAGE ===== -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/css/fontawesome.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/_common.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/css/select2.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/js/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/_common.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/byuwur/spa.js@v20.1/js/select2.full.min.js" defer></script>
  <script src="./configurator.js" defer></script>
  <!-- Shared tool categories and icons. -->
  <!-- ===== RESOURCE ===== -->
  <main class="home-layout row g-0 flex-md-nowrap flex-grow-1 overflow-hidden">
    <section class="home-intro col-12 col-md-4 d-flex flex-column gap-4 p-4 p-lg-5 overflow-y-auto" style="background: linear-gradient(180deg, var(--primary-color), var(--bywr-red-dark));" aria-labelledby="site-title">
      <div class="home-intro-top d-flex align-items-center justify-content-between gap-3">
        <img class="object-fit-contain" src="https://byuwur.github.io/img/logo.png" alt="" />
        <a class="home-source btn btn-outline-light btn-sm rounded-0 d-inline-flex align-items-center gap-2 px-3 py-2" href="https://github.com/byuwur/stream.html" target="_blank" rel="noopener">
          <i class="fa-brands fa-github" aria-hidden="true"></i> GitHub
          <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
        </a>
      </div>
      <div class="home-copy d-flex flex-column justify-content-center flex-grow-1 gap-3">
        <p class="home-eyebrow small fw-semibold text-uppercase m-0">Free. Forever.</p>
        <h1 id="site-title" class="display-2 fw-medium lh-1 m-0">stream<span class="fw-light">.html</span></h1>
        <p class="home-description lead fw-normal m-0">
          <span id="tool-count">Browser overlays</span> for your stream. Choose a tool, make it yours, and copy its URL into OBS.
        </p>
        <p class="home-motto small fw-semibold text-uppercase m-0">Simple is complicated enough.</p>
      </div>
      <div class="catalog-filter d-grid gap-2" role="search" aria-label="Find an overlay">
        <label class="w-100 m-0">
          <span class="visually-hidden">Tool category</span>
          <select id="tool-category" class="form-select bg-dark text-white border-secondary">
            <option value="all" data-icon="fa-layer-group">All tools</option>
          </select>
        </label>
        <label class="w-100 m-0">
          <span class="visually-hidden">Find a tool</span>
          <input id="tool-search" type="search" class="form-control bg-dark text-white border-secondary" placeholder="Find your overlay..." />
        </label>
      </div>
    </section>

    <nav class="home-tools col-12 col-md-8 overflow-y-auto" aria-label="Stream tools">
      <p id="catalog-empty" class="p-4" role="status" hidden>No matching overlays.</p>
    </nav>
    <template id="home-tool-template">
      <a class="home-tool d-flex flex-column gap-2 p-4 text-white has-background-cover has-overlay bg-pos-top">
        <div class="overlay" aria-hidden="true"></div>
        <div class="home-tool-top d-flex align-items-center justify-content-between gap-3">
          <span class="small fw-semibold text-uppercase text-wrap text-break"></span>
          <i class="flex-shrink-0 lh-1 m-0" aria-hidden="true"></i>
        </div>
        <div class="home-tool-info d-grid gap-2 my-auto text-start py-1">
          <h2 class="home-tool-title fw-medium text-wrap text-break m-0"></h2>
          <p class="text-wrap m-0"></p>
        </div>
        <span class="home-tool-action btn btn-outline-light btn-sm mw-100 rounded-0 d-inline-flex align-self-end align-items-center gap-2 px-3 py-2 fw-semibold">
          <span class="text-wrap" data-home-cta>Configure</span> <i class="fa-solid fa-arrow-right flex-shrink-0" aria-hidden="true"></i>
        </span>
      </a>
    </template>
  </main>
  <footer class="home-footer d-flex flex-wrap align-items-center justify-content-between gap-3 flex-shrink-0 small border-top border-dark px-4 px-lg-5 py-4">
    <p class="m-0">
      &copy; <span id="year-txt"></span>, Made with <i class="fa-solid fa-heart" role="img" aria-label="love"></i> by
      <a class="link-light text-decoration-underline" href="https://byuwur.co" target="_blank" rel="noopener">BONYUR @byUwUr</a>
    </p>
    <div class="d-flex flex-wrap gap-3">
      <a class="link-light text-decoration-underline" href="https://github.com/byuwur/stream.html/blob/main/LICENSE.md">MIT license</a>
      <a class="link-light text-decoration-underline" href="https://github.com/byuwur/stream.html">Source &amp; contributions <i class="fa-solid fa-arrow-up-right-from-square ms-1" aria-hidden="true"></i></a>
      <a class="link-light text-decoration-underline" href="https://ko-fi.com/byuwur">Buy me a Pandebono <i class="fa-brands fa-ko-fi ms-1" aria-hidden="true"></i></a>
    </div>
  </footer>

  <script>
    if (typeof jQuery === "undefined" && !window.jQuery) console.error("Init index.html FAILED. No jQuery found.");
    else window.jQuery(function () {
      const $ = window.jQuery;
      // ==========
      // ==== SHARED TOOL METADATA ====
      // ==========

      const jqCategory = $("#tool-category").on("change", filterTools);
      const jqGallery = $(".home-tools");
      const tools = byConfigurator.catalog.availableTools;
      $("#tool-count").text(`${tools.length} browser overlay${tools.length === 1 ? "" : "s"}`);
      byConfigurator.catalog.categories.forEach(group => {
        $(/* HTML */ `<option></option>`, { value: group.id, text: group.name })
          .attr("data-icon", group.icon).appendTo(jqCategory);
      });
      tools.forEach((tool, index) => {
        const jqCard = $($("#home-tool-template").prop("content").firstElementChild).clone();
        const group = byConfigurator.catalog.categories.find(group => group.id === tool.category);
        jqCard.attr({
          "data-tool": tool.id, "data-category": tool.category, "aria-label": `Configure ${tool.name}`,
          href: new URL(`${tool.id}/${location.protocol === "file:" ? "index.html" : ""}`, byConfigurator.catalog.root).href
        }).css({
          backgroundImage: `url("${new URL(`${tool.id}/prev.jpg`, byConfigurator.catalog.root).href}")`,
        });
        jqCard.find("h2").text(tool.name);
        jqCard.find("p").text(tool.description);
        jqCard.find(".home-tool-top span").text(`${String(index + 1).padStart(2, "0")} | ${group.name}`);
        jqCard.find(".home-tool-top i").attr("class", `fa-solid ${tool.icon} flex-shrink-0 lh-1 m-0`);
        jqCard.find("[data-home-cta]").text(byCommon.randomCTAMessage());
        jqCard.find(".overlay").css("background", byCommon.randomAccentColor({ tone: "dark", gradient: true, angle: 180 }));
        jqCard.appendTo(jqGallery);
      });

      // ==========
      // ==== SEARCH AND CATEGORY FILTERS ====
      // ==========

      /** Move and resize matching cards; read the latest inputs when overlapping transitions update. */
      function filterTools() {
        const update = () => {
          const query = $("#tool-search").val().trim().toLocaleLowerCase();
          const category = jqCategory.val();
          let count = 0;
          jqGallery.find(".home-tool").each(function () {
            const jqCard = $(this);
            const matchesQuery = jqCard.text().toLocaleLowerCase().includes(query);
            const matchesCategory = category === "all" || jqCard.attr("data-category") === category;
            jqCard.prop("hidden", !matchesQuery || !matchesCategory);
            if (matchesQuery && matchesCategory) jqCard.attr("data-result-index", ++count);
          });
          $("#catalog-empty").prop("hidden", count > 0);
          jqGallery.attr("data-result-count", count).scrollTop(0);
        };
        update();
      }

      /** Keep category labels as text; Font Awesome icons are declared on the native options. */
      function categoryOption(option) {
        if (!option.id) return option.text;
        const icon = $(option.element).attr("data-icon") || "fa-layer-group";
        const label = $(/* HTML */ `<span></span>`);
        $(/* HTML */ `<i></i>`, { class: `fa-solid ${icon} fa-fw me-2`, "aria-hidden": "true" }).appendTo(label);
        label.append($(/* HTML */ `<span></span>`).text(option.text));
        return label;
      }

      $("#tool-search").on("input", filterTools);
      if ($.fn.select2) {
        jqCategory.select2({
          width: "100%",
          dropdownAutoWidth: true,
          minimumResultsForSearch: Infinity,
          dropdownCssClass: "home-category-dropdown",
          templateResult: categoryOption,
          templateSelection: categoryOption
        });
        const widget = jqCategory.data("select2");
        /** Show every category when it fits; keep scrolling within the available viewport space. */
        function fitCategoryDropdown() {
          if (!widget.isOpen()) return;
          const bounds = widget.$container[0].getBoundingClientRect();
          const space = Math.max(bounds.top, innerHeight - bounds.bottom);
          widget.$results.css("max-height", Math.max(0, space - 12));
          widget.dropdown._positionDropdown();
        }
        jqCategory.on("select2:open", fitCategoryDropdown);
        $(window).on("resize.homeCategory", fitCategoryDropdown);
        // Keep the menu outside the scrolling intro, capped to the whole filter row as it resizes.
        new ResizeObserver(([entry]) => {
          widget.dropdown.$dropdown.css("max-width", entry.contentRect.width);
          fitCategoryDropdown();
        }).observe(jqCategory.closest(".catalog-filter")[0]);
      }
      filterTools(false);
      $("#year-txt").text(new Date().getFullYear());
    });
  </script>
  <style>
    /* ========== HOMEPAGE LAYOUT AND FILTERS ========== */
    .home-layout,
    .home-intro,
    .home-tools {
      min-height: 0;
      min-width: 0;
    }

    .home-intro {
      position: relative;
    }

    #site-title {
      font-size: clamp(2rem, 4vw, 4.5rem);
    }

    .home-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-rows: max-content;
      align-content: start;
    }

    #catalog-empty {
      grid-column: 1 / -1;
    }

    .home-tool[hidden] {
      display: none !important;
    }

    .home-tool {
      min-height: 15rem;
      min-width: 0;
    }

    .catalog-filter {
      grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    }

    .catalog-filter label {
      min-width: 0;
    }

    /* Common transitions make Select2's hidden native control overflow during initialization. */
    .stream-home .select2-hidden-accessible,
    .stream-home .select2-container,
    .stream-home .select2-container * {
      transition: none !important;
    }

    .stream-home .select2-container {
      min-width: 0;
      max-width: 100%;
    }

    .stream-home .select2-selection--single {
      height: auto !important;
      min-height: 2.375rem;
      background: var(--dark-color);
      border: 0.05rem solid var(--bs-secondary);
      border-radius: var(--bs-border-radius);
    }

    .stream-home .select2-selection--single .select2-selection__rendered {
      padding: 0.375rem 2rem 0.375rem 0.75rem;
      line-height: 1.5 !important;
      color: var(--light-color);
    }

    .stream-home .select2-selection--single .select2-selection__arrow {
      height: 100% !important;
      right: 0.5rem;
    }

    .stream-home .select2-container--focus .select2-selection,
    .stream-home .select2-container--open .select2-selection {
      border-color: var(--primary-foreground);
      box-shadow: 0 0 0 0.2rem color-mix(in srgb, var(--primary-foreground) 25%, transparent);
    }

    .stream-home .home-category-dropdown {
      background: var(--dark-color);
      color: var(--light-color);
      border-color: var(--bs-secondary);
    }

    .stream-home .home-category-dropdown .select2-results__option {
      padding-right: 1.25rem;
    }

    .stream-home .home-category-dropdown .select2-results__option--selected {
      background: var(--bs-secondary-bg);
    }

    .stream-home .home-category-dropdown .select2-results__option--highlighted[aria-selected] {
      background: var(--primary-color);
      color: var(--primary-foreground);
    }

    /* ========== LANDING MOTION AND CARD INTERACTIONS ========== */
    .home-intro-top img {
      width: 4rem;
      height: 4rem;
    }

    @media (min-width: 48rem) {
      .stream-home body {
        height: 100dvh;
      }

      .home-tools {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      /* Longer titles can grow without pushing the action outside its card. */
      .home-tool {
        min-height: max(15rem, 30vh);
        min-height: max(15rem, 30dvh);
      }

      /* Few results fill the gallery; intrinsic row sizing keeps longer content readable. */
      .home-tools:is([data-result-count="1"], [data-result-count="2"], [data-result-count="3"], [data-result-count="4"], [data-result-count="5"]) {
        grid-template-rows: repeat(2, minmax(max-content, 1fr));
        align-content: stretch;
      }

      .home-tools:is([data-result-count="1"], [data-result-count="2"], [data-result-count="3"], [data-result-count="4"], [data-result-count="5"]) .home-tool {
        min-height: 0;
      }

      .home-tools:is([data-result-count="1"], [data-result-count="2"], [data-result-count="3"]) {
        grid-template-columns: minmax(0, 1fr);
      }

      .home-tools[data-result-count="1"] {
        grid-template-rows: minmax(max-content, 1fr);
      }

      .home-tools[data-result-count="3"] {
        grid-template-rows: repeat(3, minmax(max-content, 1fr));
      }

      .home-tools[data-result-count="5"] {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }

      .home-tools[data-result-count="5"] .home-tool {
        grid-column: span 2;
      }

      .home-tools[data-result-count="5"] .home-tool:is([data-result-index="1"], [data-result-index="2"]) {
        grid-column: span 3;
      }
    }

    @media (min-width: 48rem) and (max-width: 61.99rem) {
      .home-intro-top img {
        width: 3rem;
        height: 3rem;
      }
    }

    @media (min-width: 62rem) {
      .home-tool {
        min-height: max(13.5rem, 30vh);
        min-height: max(13.5rem, 30dvh);
      }
    }

    @media (max-width: 47.99rem) {
      .home-intro {
        min-height: 32rem;
      }

      #site-title {
        font-size: clamp(2.5rem, 11vw, 4.5rem);
      }
    }
  </style>
</body>

</html>
